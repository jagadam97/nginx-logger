version: "3.8"
services:
  nginx-logger:
    image: ghcr.io/jagadam97/nginx-logger:latest
    environment:
      BATCH_SIZE: "${BATCH_SIZE}"
      BATCH_DELAY: "${BATCH_DELAY}"
      LOG_FILE_PATH: "${LOG_FILE_PATH}"
      INFLUX_URL: "${INFLUX_URL}"
      INFLUX_TOKEN: "${INFLUX_TOKEN}"
      INFLUX_ORG: "${INFLUX_ORG}"
      INFLUX_BUCKET: "${INFLUX_BUCKET}"
      # Published port and the port the app binds to are kept in lockstep.
      API_PORT: "${API_PORT:-8124}"
    ports:
      - "${API_PORT:-8124}:${API_PORT:-8124}"
    volumes:
      # NPM's /data/logs on the host. Read-only: the collector only tails.
      - "${NPM_LOG_DIR:-/npm/data/logs}:/var/log:ro"
